[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-backup-cli"
version = "1.0.0"
description = "Back up WordPress sites remotely via SSH"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "paramiko>=3.4.0",
    "argcomplete>=3.4.0",
    "cryptography",
]

[project.scripts]
wp_backup = "wp_backup.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wp_backup*"]
